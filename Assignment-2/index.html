<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="/#style.css"/>
</head>
<body>
    <h1>Job Application Form</h1>
    <p>Please fill in the details below to apply for a job.</p>

    <form>
        <fieldset>

         <legend>Application form </legend>

           <label for="fName">First Name:</label>
           <br/>
           <input 
           type="text" 
           id="fName" 
           name="username"
           placeholder="eg: Angel"/>
           required
           <br /><br />

           <label for="lName">Last Name:</label>
           <br/>
           <input 
           type="text" 
           id="lName" 
           name="userlastname"
           placeholder="eg: Rishiwal"/>
           required
           <br /><br />

           <label for="useremail">Enter your Email ID:</label>
           <br/>
           <input 
           type="email" 
           id="useremail" 
           name="useremail"
           placeholder="eg: abc@gamil.com"/>
           required
           <br /><br />

           <label for="userpassword">Password:</label>
           <br/>
           <input
            type="password" 
            id="userpassword" 
            name="userpassword"
            placeholder="Enter password"/>
            required
            <button type="button" onclick="showPassword()">👁️</button>
            <br /><br />

          <label for="contact number">Enter your phone number:</label>
          <br/>
          <input 
          type="tel" 
          id="contact number" 
          name="userContactnumber"
          placeholder="Enter phone number"/>
          required
          <br><br>

           <label for="url of any website">Portfolio URL:</label>
           <br/>
           <input 
           type="URL" 
           id="url of any website" 
           name="userwebsite"
           placeholder="eg: https://www.google.co.in/"/>
           required
           <br/><br/>

           <label for="userAge">Enter your Age:</label>
           <br/>
           <input 
           type="age" 
           id="userAge" 
           name="userAge"
           placeholder="eg: 18"
           min="18"
           max="60"/>
           required
           <br/><br/>

           <!-- Data inputs -->
           <label for="Date of birth" >Enter your DOB: </label>
           <br/>
           <input 
            type="date"
            id="Date of birth"
            placeholder="eg: 10/06/2008"
            name="usrDOB"/>
            required
            <br/><br/>


         <br>


          <!-- Radio Buttons -->
          <p>Gender:</p>

          <input type="radio" id="male" name="gender" value="Male">
          <label for="male">Male</label>

          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>

          <input type="radio" id="other" name="gender" value="Other">
          <label for="other">Other</label>

          <br><br>

           <!-- Checkboxes -->
           <p>Skills:</p>

          <input type="checkbox" id="java" name="skills" value="Java">
          <label for="java">Java</label>

          <input type="checkbox" id="html" name="skills" value="HTML">
          <label for="html">HTML</label>

          <input type="checkbox" id="css" name="skills" value="CSS">
          <label for="css">CSS</label>

          <br><br>

          <!-- Select and Option -->
          <label for="job">Select Job Role:</label>

          <select id="job" name="job" required>
             <option value="">Choose a job role</option>
             <option value="developer">Web Developer</option>
             <option value="designer">Web Designer</option>
             <option value="tester">Software Tester</option>
          </select>

          <br><br>

           <!-- Datalist -->
           <label for="city">Preferred City:</label>
           <br/>
           <input list="cities" id="city" name="city"
           placeholder="Enter or select city">

            <datalist id="cities">
              <option value="Delhi">
              <option value="Mumbai">
              <option value="Bangalore">
              <option value="Noida">
              <option value="Bareilly">
           </datalist>
            
           <h2>Upload & Extras</h2>
           <h3>Additional Information</h3>

            <!-- Date -->
              <label for="date">Available Form</label>
              <br/>
              <input type="date" id="date" name="date">

              <br><br>

              <!-- Time -->
                 <label for="time">Available Interview Time:</label>
                 <br/>
                 <input type="time" id="time" name="time">

                 <br><br>

              <!-- File -->
                 <label for="resume">Upload Resume:</label>
                 <br/>
                 <input type="file" id="resume" name="resume">

                     <br><br>

                <!-- Range -->
                  <label for="experience">Experience Level:</label>
                  <br/>
                  <input type="range" id="experience"
                   name="experience" min="0" max="10">

                   <br><br>

                 <!-- Color -->
                   <label for="color">Favorite Color:</label>
                   <br/>
                   <input type="color" id="color" name="color">

                   <br><br>

                 <!-- Textarea -->
                  <label for="message">Why should we hire you?</label>
                   <br/>
                   <textarea id="message" name="message"
                   rows="5" columns="300"
                   placeholder="Write about yourself"></textarea>

                   <br><br>

                   <!-- Submit Button -->
                   <input type="submit" value="Submit Application">
                   <br/><br/>

                    <!-- Reset Button -->
                     <input type="reset" value="Reset Form">
                     <br/><br/>
             
            </fieldset>
    </form>
</body>
</html>
